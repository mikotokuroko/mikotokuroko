<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">hoi's cozy creative room at sunset</title>
  <desc id="desc">An original pastel cyber-kawaii room with glowing windows, a music player, a light-to-dark browser, plants, books, and a sleeping desk creature. Calm native SVG animations move the light, particles, equalizer, and cursor.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#503b81"/><stop offset=".48" stop-color="#8a5798"/><stop offset="1" stop-color="#e49ca9"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7668d9"/><stop offset=".5" stop-color="#e88fc0"/><stop offset="1" stop-color="#ffbd8d"/></linearGradient>
    <radialGradient id="sunset" cx="20%" cy="70%" r="72%"><stop stop-color="#fff4bf" stop-opacity=".98"/><stop offset=".25" stop-color="#ffca91" stop-opacity=".75"/><stop offset=".65" stop-color="#ff96bd" stop-opacity=".2"/><stop offset="1" stop-color="#8a76da" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".42"/><stop offset=".35" stop-color="#c9f8ff" stop-opacity=".08"/><stop offset="1" stop-color="#ffdbf0" stop-opacity=".3"/></linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4c8" stop-opacity=".48"/><stop offset="1" stop-color="#ffb8cf" stop-opacity="0"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7a4f78"/><stop offset=".48" stop-color="#b96f91"/><stop offset="1" stop-color="#643f6d"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#261f56"/><stop offset=".52" stop-color="#423472"/><stop offset="1" stop-color="#22375f"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#684566"/><stop offset="1" stop-color="#31284f"/></linearGradient>
    <linearGradient id="pet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe0ed"/><stop offset=".55" stop-color="#d8c8ff"/><stop offset="1" stop-color="#91dded"/></linearGradient>
    <pattern id="pixels" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="2" height="2" x="2" y="2" fill="#fff" opacity=".12"/><rect width="2" height="2" x="11" y="9" fill="#ffc9ea" opacity=".11"/></pattern>
    <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="shadow" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#251c48" flood-opacity=".48"/></filter>
    <clipPath id="roomClip"><rect width="1200" height="560" rx="24"/></clipPath>
    <clipPath id="windowClip"><rect x="44" y="44" width="716" height="298" rx="10"/></clipPath>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line { stroke: #493566; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
      .thin { stroke: #493566; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .glow { animation: glow 6s ease-in-out infinite; transform-origin: center; }
      .monitor-glow { animation: monitor 4.5s ease-in-out infinite; }
      .dust-a { animation: drift-a 9s ease-in-out infinite; }
      .dust-b { animation: drift-b 12s ease-in-out infinite; }
      .eq1 { animation: eq 1.1s ease-in-out infinite alternate; transform-origin: 0 100%; }
      .eq2 { animation: eq .8s ease-in-out -.3s infinite alternate; transform-origin: 0 100%; }
      .eq3 { animation: eq 1.3s ease-in-out -.6s infinite alternate; transform-origin: 0 100%; }
      .eq4 { animation: eq .95s ease-in-out -.15s infinite alternate; transform-origin: 0 100%; }
      .pet-breathe { animation: breathe 3.8s ease-in-out infinite; transform-origin: 884px 418px; }
      .pet-tail { animation: tail 5s ease-in-out infinite; transform-origin: 936px 428px; }
      .status { animation: status 4.2s steps(1,end) infinite; }
      .cursor { animation: cursor 7s ease-in-out infinite; }
      .dark-pane { animation: darkmode 8s ease-in-out infinite; }
      .toggle { animation: toggle 8s ease-in-out infinite; }
      .float-note { animation: note 5s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity:.72; transform:scale(1); } 50% { opacity:1; transform:scale(1.025); } }
      @keyframes monitor { 0%,100% { opacity:.55; } 50% { opacity:.92; } }
      @keyframes drift-a { 0%,100% { transform:translate(0,0); opacity:.25; } 50% { transform:translate(12px,-18px); opacity:.85; } }
      @keyframes drift-b { 0%,100% { transform:translate(0,0); opacity:.7; } 50% { transform:translate(-16px,-13px); opacity:.2; } }
      @keyframes eq { from { transform:scaleY(.28); } to { transform:scaleY(1); } }
      @keyframes breathe { 0%,100% { transform:translateY(0) scaleY(1); } 50% { transform:translateY(-2px) scaleY(1.035); } }
      @keyframes tail { 0%,82%,100% { transform:rotate(0); } 88% { transform:rotate(7deg); } 94% { transform:rotate(-4deg); } }
      @keyframes status { 0%,62% { fill:#78f2d2; } 63%,70% { fill:#fff29e; } 71%,100% { fill:#78f2d2; } }
      @keyframes cursor { 0%,12% { transform:translate(0,0); opacity:0; } 18%,48% { opacity:1; } 52% { transform:translate(62px,34px); opacity:1; } 58%,100% { transform:translate(62px,34px); opacity:0; } }
      @keyframes darkmode { 0%,34%,100% { opacity:0; } 46%,82% { opacity:1; } 92% { opacity:0; } }
      @keyframes toggle { 0%,34%,100% { transform:translateX(0); fill:#ffbd73; } 46%,82% { transform:translateX(14px); fill:#8ee9ff; } 92% { transform:translateX(0); fill:#ffbd73; } }
      @keyframes note { 0%,100% { transform:translate(0,4px); opacity:.25; } 45% { transform:translate(6px,-9px); opacity:.9; } 75% { opacity:.45; } }
      @media (prefers-reduced-motion: reduce) {
        .glow,.monitor-glow,.dust-a,.dust-b,.eq1,.eq2,.eq3,.eq4,.pet-breathe,.pet-tail,.status,.cursor,.dark-pane,.toggle,.float-note { animation:none !important; }
        .dark-pane { opacity:.58; }
        .cursor { opacity:.7; transform:translate(38px,20px); }
      }
    </style>
  </defs>
