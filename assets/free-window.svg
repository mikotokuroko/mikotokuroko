<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" role="img" aria-labelledby="title description">
  <title id="title">free?</title>
  <desc id="description">A free time window: I’m a night person. Sleeping in, gaming, and travel, with a gently moving cursor.</desc>
  <!-- Window chrome follows the approved greeting/music palette. GitHub source: https://github.com/lezzthanthree/Needy-Streamer-Overload/tree/master/%40Resources/Images/Desktop%20Icons/Icons -->
  <style>
    .free-cursor { transform-box: fill-box; transform-origin: 0 0; animation: free-cursor-loop 12s ease-in-out infinite; }
    @keyframes free-cursor-loop {
      0%,16% { transform: translate(0,0); }
      24% { transform: translate(170px,0); }
      40% { transform: translate(170px,0); }
      48% { transform: translate(340px,0); }
      64% { transform: translate(340px,0); }
      72%,100% { transform: translate(0,0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .free-cursor { animation: none; transform: translate(0,0); }
    }
  </style>
