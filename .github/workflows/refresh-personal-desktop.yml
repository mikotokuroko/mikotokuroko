name: Refresh profile activity

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch music metadata
        id: music
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: .generated/on-rotation.svg
          output_action: none
          optimize: no
          config_base64: no
          plugins_errors_fatal: yes
          token: NOT_NEEDED
          base: ""
          template: "@needy-player"
          setup_community_templates: "${{ github.repository }}@${{ github.sha }}:needy-player"
          plugin_music: yes
          plugin_music_mode: playlist
          plugin_music_playlist: https://embed.music.apple.com/mo/playlist/peaceful/pl.u-MDAWWjguWLNb69v?l=en
          plugin_music_limit: 1

      - name: Fetch Steam metadata
        id: steam
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with:
          filename: .generated/steam-recent.svg
          output_action: none
          optimize: no
          config_base64: no
          plugins_errors_fatal: yes
          token: NOT_NEEDED
          base: ""
          template: "@needy-steam"
          setup_community_templates: "${{ github.repository }}@${{ github.sha }}:needy-steam"
          plugin_steam: yes
          plugin_steam_token: ${{ secrets.STEAM_TOKEN }}
          plugin_steam_user: "76561199045338784"
          plugin_steam_sections: recently-played
          plugin_steam_recent_games_limit: 10
          plugin_steam_achievements_limit: 0

      - name: Update README activity regions
        env:
          MUSIC_OUTCOME: ${{ steps.music.outcome }}
          STEAM_OUTCOME: ${{ steps.steam.outcome }}
        run: |
          args=()
          if [[ "$MUSIC_OUTCOME" == "success" ]]; then
            args+=(--music /metrics_renders/.generated/on-rotation.svg)
          fi
          if [[ "$STEAM_OUTCOME" == "success" ]]; then
            args+=(--steam /metrics_renders/.generated/steam-recent.svg)
          fi
          python3 scripts/update_profile.py "${args[@]}"

      - name: Commit refreshed README
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Refresh profile activity"
            git push
          fi
