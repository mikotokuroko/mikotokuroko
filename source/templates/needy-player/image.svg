<%
  const track = plugins.music?.tracks?.[0]
  const escapeXml = (value) => String(value).replace(/[&<>"']/g, (character) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"})[character])
  const data = track ? {title: track.name, artist: track.artist, artwork: track.artwork || ""} : null
%>
<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1">
  <metadata id="profile-data"><%= escapeXml(JSON.stringify(data)) %></metadata>
</svg>
