<%
  const track = plugins.music?.tracks?.[0]
  const escapeXml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;"})[character])
  const truncate = (value, length = 34) => value.length > length ? `${value.slice(0, length - 1)}…` : value
  const title = track ? truncate(track.name || "untitled") : "NO_MUSIC_DATA"
  const artist = track ? truncate(track.artist || "unknown artist", 40) : "add a public Apple Music playlist"
  const artwork = track?.artwork || ""
%>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="408" viewBox="0 0 960 408" role="img" aria-labelledby="title description">
  <title id="title">On rotation</title>
  <desc id="description">A randomly selected track from hoi's public Apple Music playlist.</desc>
  <defs>
    <linearGradient id="placeholder" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff9fc9"/>
      <stop offset="1" stop-color="#8ce9ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#2d1768" flood-opacity=".3"/>
    </filter>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { fill: #3d1977; font-size: 26px; font-weight: 700; }
      .copy { fill: #5c3982; font-size: 18px; }
      .tiny { fill: #72538f; font-size: 14px; letter-spacing: 1px; }
    </style>
  </defs>
  <image href="third-party/needy-streamer-window.png" width="960" height="408" preserveAspectRatio="none"/>
  <g filter="url(#shadow)">
    <rect x="54" y="102" width="202" height="202" rx="9" fill="url(#placeholder)"/>
    <% if (artwork) { %><image href="<%= escapeXml(artwork) %>" x="54" y="102" width="202" height="202" preserveAspectRatio="xMidYMid slice" clip-path="url(#cover)"/><% } %>
  </g>
  <clipPath id="cover"><rect x="54" y="102" width="202" height="202" rx="9"/></clipPath>
  <path d="M54 315h202" stroke="#8ae8ee" stroke-width="9" stroke-linecap="round"/>
  <text x="298" y="142" class="tiny">✩♬ ₊˚.🎧⋆☾⋆⁺₊✧</text>
  <text x="298" y="190" class="title">» <%= escapeXml(title) %> «</text>
  <text x="298" y="222" class="copy"><%= escapeXml(artist) %></text>
  <text x="298" y="256" class="tiny">ON ROTATION · APPLE MUSIC PLAYLIST</text>
  <path d="M298 287h455" stroke="#c9addb" stroke-width="6" stroke-linecap="round"/>
  <path d="M298 287h168" stroke="#62d9e5" stroke-width="6" stroke-linecap="round"/>
  <circle cx="466" cy="287" r="9" fill="#ff8fbd" stroke="#3d1977" stroke-width="3"/>
  <text x="298" y="329" class="copy">0:08 ─〇───── 1:00</text>
  <text x="298" y="366" class="title">⇄ ◃◃ ⅠⅠ ▹▹ ↻</text>
  <circle cx="828" cy="342" r="7" fill="#72e8d1"/>
  <text x="846" y="348" class="tiny">LOCAL</text>
</svg>
