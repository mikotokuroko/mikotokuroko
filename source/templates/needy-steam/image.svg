<%
  const recentGames = plugins.steam?.games?.["recently-played"] || []
  const featuredGames = ["cyberpunk 2077", "stardew valley", "wallpaper engine"]
  const game = recentGames.find(({name = ""}) => featuredGames.includes(name.toLowerCase())) || recentGames[0]
  const escapeXml = (value) => String(value).replace(/[&<>"']/g, (character) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"})[character])
  const data = game ? {title: game.name, icon: game.icon || ""} : null
%>
<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1">
  <metadata id="profile-data"><%= escapeXml(JSON.stringify(data)) %></metadata>
</svg>
